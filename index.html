<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đấu trường tri thức V3.1</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#f1f6ff;background:radial-gradient(ellipse at top,#244b91,#080f29 75%);min-height:100vh}header{text-align:center;padding:22px}h1{margin:0;color:#ffdb76;font-size:clamp(25px,4vw,48px);text-shadow:0 3px 18px #e6a62e77}header p{letter-spacing:2px;color:#b9d5ff}nav,.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px}button,input,textarea,select{font:inherit;border-radius:10px;border:1px solid #5674a4;padding:10px}button{cursor:pointer;background:#254a80;color:white;font-weight:700}button:hover{background:#3865a4}button:disabled{opacity:.4;cursor:default}.gold{background:#e8b64b;color:#17233b}.panel{background:#122447e8;border:1px solid #45628e;border-radius:20px;padding:20px;margin:15px auto;max-width:1150px;box-shadow:0 12px 40px #0004}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}.player{text-align:center;background:linear-gradient(#294d80,#142b50);border:2px solid #4e77a9;border-radius:17px;padding:10px;transition:.45s;min-height:142px}.face{font-size:52px;line-height:1.3;display:inline-block;filter:drop-shadow(0 7px 4px #0006);background:radial-gradient(circle at 35% 20%,#ffffff80,transparent 70%);border-radius:50%;width:76px;height:76px}.player.correct{background:#14543b;border-color:#6cffae;box-shadow:0 0 20px #43ff9577}.player.fast{background:#71501b;border-color:#ffdf70;box-shadow:0 0 30px #ffd65d;transform:scale(1.04)}.player.wrong{background:#141923;border-color:#303746}.wrong .face{filter:grayscale(1) brightness(.22)}.player.sent{border-color:#c3a1ff;background:#473568}.stars{color:#ffdc69;font-weight:bold}.status{font-size:12px;color:#c2d4ef}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{text-align:left;min-height:48px}.answers .right{background:#167447;border-color:#75ffad}.answers .chosen{outline:3px solid #bd9bff}.meta{display:flex;justify-content:space-between;color:#ffdc69}h2{text-align:center}input,textarea,select{background:#0b1934;color:white;width:100%;margin:5px 0}label{display:block;color:#c3d6f5}small{color:#b8c9e3}.editor{border-bottom:1px solid #45628e;padding:12px 0}.rank{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #45628e}.avatarpick{font-size:30px}.avatarpick.selected{outline:3px solid gold}@media(max-width:600px){.answers{grid-template-columns:1fr}.panel{margin:8px;padding:12px}.grid{grid-template-columns:repeat(3,1fr)}}
 .grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}.player{min-height:125px}.face{background:radial-gradient(circle at 32% 20%,#fff9,#75a9d955 48%,#07152e88 80%);box-shadow:inset 0 -5px 10px #0005}.correct .face,.fast .face{animation:bounce .65s ease}@keyframes bounce{50%{transform:scale(1.16)}}.podium{display:flex;align-items:end;justify-content:center;gap:10px;margin:20px 0}.podium>div{width:30%;text-align:center;background:linear-gradient(#35527e,#182a48);border-radius:15px;padding:12px}.podium>div:first-child{order:2;background:linear-gradient(#9d7425,#4b3513);padding-top:35px}.podium>div:nth-child(2){order:1}.podium>div:nth-child(3){order:3}.podium .face{font-size:46px}#introOverlay{position:fixed;inset:0;background:#050b1b;z-index:100;display:grid;place-content:center;text-align:center;padding:20px}#introOverlay video{width:min(90vw,1100px);max-height:75vh} @media(max-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.face{width:60px;height:60px;font-size:42px}} </style><header><h1>✦ ĐẤU TRƯỜNG TRI THỨC ✦</h1><p>CHINH PHỤC KIẾN THỨC – TỎA SÁNG BẢN THÂN</p></header><main id="app" class="panel"></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const app=document.getElementById('app'), $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), room=new URLSearchParams(location.search).get('room'), icons=['🦊','🐼','🐱','🦁','🐰','🐻','🐯','🐨','🐶','🐧','🐸','🦄','🐹','🐝','🐙','🐥'];
let peer,conn,clients=new Map(),players=new Map(),phase='lobby',idx=0,deadline=0,started=0,selected=0,state=null,me='',chosen=-1,ctx,sound=true,roundToken=0,notice='',timer;
let questions=[{q:'Liên kết cộng hoá trị hình thành bằng cách nào?',a:['Nhường electron','Dùng chung electron','Nhận proton','Dùng chung neutron'],correct:1,seconds:20},{q:'Liên kết ion hình thành do lực hút giữa các ion nào?',a:['Trái dấu','Cùng dấu','Trung hoà','Không mang điện'],correct:0,seconds:20},{q:'Phân tử nào chứa liên kết ba?',a:['H₂','O₂','N₂','Cl₂'],correct:2,seconds:20}];try{questions=JSON.parse(localStorage.getItem('dttt-v2-questions'))||questions}catch{}
function audio(){try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}function tune(notes){if(!sound||!ctx)return;notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.13;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.25)})}let bgTimer,beat=0,introURL='',introTimeout;function stopMusic(){clearInterval(bgTimer);bgTimer=null}function music(){if(bgTimer)return;beat=0;bgTimer=setInterval(()=>{if(!sound||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=[130.81,196,164.81,196,146.83,220,174.61,220][beat++%8];g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.035,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.34)},380)}function chooseIntro(e){let f=e.target.files[0];if(!f)return;if(introURL)URL.revokeObjectURL(introURL);introURL=URL.createObjectURL(f);notice='Đã chọn video intro trên máy.';renderHost()}function closeIntro(){clearTimeout(introTimeout);document.getElementById('introOverlay')?.remove();intro()}function playIntro(){audio();let d=document.createElement('div');d.id='introOverlay';d.innerHTML=introURL?'<video id="introVideo" playsinline controls></video><button onclick="closeIntro()">Bỏ qua intro</button>':'<h1>✦ ĐẤU TRƯỜNG TRI THỨC ✦</h1><p>Chinh phục kiến thức – Tỏa sáng bản thân</p><button onclick="closeIntro()">Bỏ qua intro</button>';document.body.append(d);if(introURL){let v=$('introVideo');v.src=introURL;v.ontimeupdate=()=>{if(v.currentTime>=22)closeIntro()};v.onended=closeIntro;v.play().catch(()=>{})}else{intro();introTimeout=setTimeout(closeIntro,5000)}}function home(){if(confirm('Rời phòng hiện tại? Hãy xuất kết quả trước nếu cần.'))location.href=location.href.split('?')[0].split('#')[0]}function replay(){stopMusic();clearInterval(timer);roundToken++;idx=0;phase='lobby';players.forEach(p=>Object.assign(p,{stars:0,fast:0,total:0,answer:-1,time:0,status:''}));broadcast();renderHost()}function intro(){tune([262,330,392,523,392,523,659,784])}function toggle(){audio();sound=!sound;notice=sound?'Âm thanh bật':'Âm thanh tắt';renderHost()}
function editor(){app.innerHTML='<h2>Quản trị bộ đề</h2><p>Nhập câu hỏi, 4 đáp án, đáp án đúng và thời gian. Dữ liệu lưu trên trình duyệt.</p><div id="edit"></div><div class="controls"><button onclick="add()">+ Thêm câu</button><button onclick="save()">Lưu đề</button><button class="gold" onclick="host()">Tạo phòng trực tuyến</button></div><p id="msg"></p>';drawEdit()}
function drawEdit(){$('edit').innerHTML=questions.map((q,i)=>`<div class="editor"><b>Câu ${i+1}</b><input id="q${i}" value="${esc(q.q)}">${q.a.map((a,j)=>`<input id="a${i}_${j}" value="${esc(a)}" placeholder="${'ABCD'[j]}">`).join('')}<label>Đáp án đúng<select id="c${i}">${[0,1,2,3].map(j=>`<option value="${j}" ${j===q.correct?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select></label><label>Thời gian (giây)<input type="number" min="5" max="180" id="t${i}" value="${q.seconds}"></label><button onclick="removeQ(${i})">Xóa câu</button></div>`).join('')}
function read(){questions=questions.map((_,i)=>({q:$('q'+i).value.trim(),a:[0,1,2,3].map(j=>$('a'+i+'_'+j).value.trim()),correct:+$('c'+i).value,seconds:Math.max(5,Math.min(180,+$('t'+i).value||20))}))}function add(){read();questions.push({q:'',a:['','','',''],correct:0,seconds:20});drawEdit()}function removeQ(i){read();questions.splice(i,1);drawEdit()}function save(){read();if(!questions.length||questions.some(q=>!q.q||q.a.some(a=>!a))){$('msg').textContent='Vui lòng điền đầy đủ câu hỏi và đáp án.';return false}localStorage.setItem('dttt-v2-questions',JSON.stringify(questions));$('msg').textContent='Đã lưu.';return true}
function host(){if(!save())return;audio();if(typeof Peer==='undefined'){$('msg').textContent='Không tải được PeerJS. Kiểm tra Internet.';return} $('msg').textContent='Đang tạo phòng…';peer=new Peer();peer.on('open',()=>{intro();renderHost()});peer.on('error',e=>{notice='Lỗi kết nối: '+e.type;if($('msg'))$('msg').textContent=notice;else renderHost()});peer.on('connection',c=>{clients.set(c.peer,c);c.on('data',d=>receive(c,d));c.on('close',()=>{clients.delete(c.peer);if(players.has(c.peer)){players.get(c.peer).online=false;broadcast();renderHost()}})})}
function receive(c,d){if(!d||typeof d!=='object')return;if(d.type==='join'&&phase!=='end'&&!players.has(c.peer)&&players.size<60){let name=String(d.name||'').trim().slice(0,35);if(!name)return;players.set(c.peer,{id:c.peer,name,icon:icons.includes(d.icon)?d.icon:icons[0],stars:0,fast:0,total:0,answer:-1,time:0,status:'',online:true});tune([660,880]);broadcast();renderHost()}else if(d.type==='answer'&&phase==='question'&&d.round===roundToken&&Date.now()<=deadline&&players.has(c.peer)){let p=players.get(c.peer);if(p.answer!==-1||!Number.isInteger(d.answer)||d.answer<0||d.answer>3)return;p.answer=d.answer;p.time=Date.now()-started;p.status='sent';broadcast();renderHost()}}
function snapshot(id){let q=questions[idx],p=players.get(id);return {type:'state',phase,idx,count:questions.length,round:roundToken,remaining:Math.max(0,deadline-Date.now()),q:phase==='lobby'||phase==='end'?null:{q:q.q,a:q.a,correct:phase==='reveal'||phase==='gold'?q.correct:null},me:p||null}}
function broadcast(){clients.forEach((c,id)=>{if(c.open)c.send(snapshot(id))})}function start(){audio();if(!players.size){notice='Cần ít nhất một học sinh tham gia.';renderHost();return}roundToken++;phase='question';players.forEach(p=>{p.answer=-1;p.time=0;p.status=''});music();started=Date.now();deadline=started+questions[idx].seconds*1000;tune([392,523,659]);broadcast();renderHost();clearInterval(timer);timer=setInterval(()=>{if(phase!=='question')return;let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('clock'))$('clock').textContent=t+' giây';if(!t)reveal()},200)}
function reveal(){if(phase!=='question')return;clearInterval(timer);stopMusic();phase='reveal';let correct=[...players.values()].filter(p=>p.answer===questions[idx].correct).sort((a,b)=>a.time-b.time);players.forEach(p=>{p.status=p.answer===questions[idx].correct?'correct':'wrong';if(p.status==='correct'){p.stars++;p.total+=p.time}});tune([262,392,523,659,784,1047,1319]);broadcast();renderHost();let token=roundToken;setTimeout(()=>{if(phase!=='reveal'||token!==roundToken)return;if(correct.length){correct[0].status='fast';correct[0].fast++;tune([523,659,784,1047,1319])}phase='gold';broadcast();renderHost()},1400)}function next(){if(phase!=='gold')return;if(idx+1===questions.length){phase='end';tune([392,523,659,784,1047]);broadcast();renderHost()}else{idx++;start()}}
function link(){return location.href.split('?')[0].split('#')[0]+'?room='+encodeURIComponent(peer.id)}async function copyLink(){try{await navigator.clipboard.writeText(link());notice='Đã sao chép link.'}catch{notice='Hãy sao chép link trong ô bên dưới.'}renderHost()}
function rank(){return [...players.values()].sort((a,b)=>b.stars-a.stars||b.fast-a.fast||a.total-b.total)}function card(p){return `<div class="player ${p.status}"><div class="face">${p.icon}</div><div>${esc(p.name)}</div><div class="stars">⭐ ${p.stars} · ⚡ ${p.fast}</div><div class="status">${p.status==='fast'?'Nhanh nhất · '+(p.time/1000).toFixed(2)+'s':p.status==='correct'?'Chính xác':p.status==='wrong'?'Chưa đúng':p.status==='sent'?'Đã trả lời':p.online?'Sẵn sàng':'Mất kết nối'}</div></div>`}
function renderHost(){let q=questions[idx];app.innerHTML=`<div class="meta"><span>${players.size} thí sinh</span><span id="clock">${phase==='question'?Math.max(0,Math.ceil((deadline-Date.now())/1000))+' giây':''}</span></div><div class="controls"><button onclick="home()">⌂ Trang chủ</button><button onclick="toggle()">🔊 ${sound?'Tắt':'Bật'} âm thanh</button>${phase==='lobby'?'<button onclick="playIntro()">▶ Phát intro</button><label>Chọn video intro (0–22s)<input type="file" accept="video/*" onchange="chooseIntro(event)"></label><button class="gold" onclick="start()">Bắt đầu đấu trường</button>':phase==='question'?'<button onclick="reveal()">Chốt & công bố</button>':phase==='gold'?'<button class="gold" onclick="next()">'+(idx+1===questions.length?'Vinh danh':'Câu tiếp theo')+'</button>':''}</div>${phase==='lobby'?`<h2>Phòng chờ</h2><input readonly value="${esc(link())}" onclick="this.select()"><button onclick="copyLink()">Sao chép link học sinh</button><p>Giữ trang giáo viên mở trong suốt trò chơi.</p>`:phase==='end'?'<h2>🏆 VINH DANH</h2><div class="podium">'+rank().slice(0,3).map((p,i)=>`<div><h2>${['🥇','🥈','🥉'][i]}</h2>${card(p)}</div>`).join('')+'</div>'+rank().map((p,i)=>`<div class="rank">${i+1}. ${p.icon} ${esc(p.name)} <span>⭐ ${p.stars} · ⚡ ${p.fast}</span></div>`).join('')+'<div class="controls"><button onclick="exportCSV()">Xuất CSV</button><button onclick="replay()">Chơi lại</button><button onclick="home()">Tạo phòng mới / Trang chủ</button></div>':`<h2>Câu ${idx+1}/${questions.length}: ${esc(q.q)}</h2><div class="answers">${q.a.map((a,i)=>`<button class="${(phase==='reveal'||phase==='gold')&&i===q.correct?'right':''}">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div>`}<p>${esc(notice)}</p><div class="grid">${[...players.values()].map(card).join('')}</div>`}
function exportCSV(){let rows=[['Tên','Số câu đúng','Nhanh nhất','Tổng thời gian đúng (ms)'],...rank().map(p=>[p.name,p.stars,p.fast,p.total])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='ket-qua.csv';a.click()}
function joinUI(){app.innerHTML='<h2>Tham gia đấu trường</h2><input id="name" maxlength="35" placeholder="Tên hiển thị hoặc biệt danh"><p>Chọn nhân vật</p><div class="grid">'+icons.map((a,i)=>`<button class="avatarpick ${i===selected?'selected':''}" onclick="pick(${i})">${a}</button>`).join('')+'</div><button class="gold" onclick="join()">Vào sân chơi</button><p id="msg"></p>'}function pick(i){selected=i;document.querySelectorAll('.avatarpick').forEach((b,j)=>b.classList.toggle('selected',i===j))}function join(){audio();me=$('name').value.trim();if(!me)return;if(typeof Peer==='undefined'){$('msg').textContent='Không tải được PeerJS.';return}$('msg').textContent='Đang kết nối…';if(peer)peer.destroy();peer=new Peer();const attempt=peer;setTimeout(()=>{if(peer===attempt&&!state?.me&&$('msg'))$('msg').textContent='Chưa kết nối được. Kiểm tra giáo viên đang mở phòng, thử mạng khác rồi bấm Vào sân chơi lần nữa.'},15000);peer.on('open',()=>{conn=peer.connect(room,{reliable:true});conn.on('open',()=>{conn.send({type:'join',name:me,icon:icons[selected]});$('msg').textContent='Đang chờ xác nhận vào phòng…'});conn.on('data',d=>{if(d.type!=='state')return;let old=state;state=d;if(!d.me){if($('msg'))$('msg').textContent='Phòng chưa xác nhận người chơi.';return;}if(!old||old.round!==d.round)chosen=-1;if(d.phase==='question')music();else stopMusic();if(d.phase==='reveal'&&old?.phase!=='reveal'){if(d.me.status==='correct')tune([523,659,880]);else tune([330,247,196])};if(d.phase==='gold'&&old?.phase!=='gold'&&d.me.status==='fast')tune([523,659,784,1047]);student()});conn.on('close',()=>{stopMusic();joinUI();$('name').value=me;$('msg').textContent='Đã mất kết nối. Hãy tham gia lại.'});conn.on('error',()=>{joinUI();$('name').value=me;$('msg').textContent='Kết nối thất bại. Hãy thử lại.'})});peer.on('error',e=>{if($('msg'))$('msg').textContent='Không kết nối được: '+e.type})}function answer(i){if(chosen!==-1||state.phase!=='question'||!conn.open)return;audio();tune([440,660]);chosen=i;conn.send({type:'answer',round:state.round,answer:i});student()}function student(){let s=state,p=s.me;app.innerHTML=card(p)+(s.phase==='lobby'?'<h2>Chờ giáo viên bắt đầu</h2>':s.phase==='end'?'<h2>Hoàn thành! ⭐ '+p.stars+' · ⚡ '+p.fast+'</h2>':`<h2>Câu ${s.idx+1}/${s.count}: ${esc(s.q.q)}</h2><div class="answers">${s.q.a.map((a,i)=>`<button ${s.phase!=='question'||chosen!==-1?'disabled':''} class="${s.q.correct===i?'right':chosen===i?'chosen':''}" onclick="answer(${i})">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div><p>${s.phase==='question'?(chosen!==-1?'Đã gửi đáp án':'Chọn một đáp án'):'Kết quả đã công bố'}</p>`)}if(room)joinUI();else editor();
</script></html>
